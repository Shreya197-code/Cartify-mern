  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#cartifyGrad)" filter="url(#shadow)" />

  <!-- Modern Sleek Shopping Bag Geometry -->
  <!-- Handle -->
